{% extends "base.html" %}
{% block title %}Вход — MyEquip{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card">
    <h1>Вход в MyEquip</h1>
    <p class="hint">Учёт снаряжения клуба</p>

    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">
        <span>Телефон или почта</span>
        <input type="text" name="login" value="{{ login or '' }}" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Войти</button>
    </form>

    <div class="auth-links">
      Есть код приглашения? <a href="/register">Зарегистрироваться</a>
    </div>
  </div>
</div>
{% endblock %}
